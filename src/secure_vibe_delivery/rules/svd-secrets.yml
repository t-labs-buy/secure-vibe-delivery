# Secure Vibe Delivery — high-signal secret patterns, run alongside Semgrep's p/secrets
# when Snyk Secrets is not available on the organisation's plan.
rules:
  - id: svd-secret-aws-access-key-id
    languages: [generic]
    severity: ERROR
    message: AWS access key ID in source. Rotate it in IAM, then load it from the environment.
    metadata: {secret_kind: "AWS access key ID", cwe: ["CWE-798"]}
    pattern-regex: '\b((?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16})\b'
  - id: svd-secret-aws-secret-key
    languages: [generic]
    severity: ERROR
    message: AWS secret access key in source. Rotate it in IAM, then load it from the environment.
    metadata: {secret_kind: "AWS secret access key", cwe: ["CWE-798"]}
    pattern-regex: '(?i)aws.{0,20}secret.{0,20}[''"]([A-Za-z0-9/+=]{40})[''"]'
  - id: svd-secret-private-key
    languages: [generic]
    severity: ERROR
    message: Private key in source. Revoke and reissue it; store it in a secret manager.
    metadata: {secret_kind: "Private key", cwe: ["CWE-321"]}
    pattern-regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----'
  - id: svd-secret-github-token
    languages: [generic]
    severity: ERROR
    message: GitHub token in source. Revoke it in GitHub settings and issue a new one.
    metadata: {secret_kind: "GitHub token", cwe: ["CWE-798"]}
    pattern-regex: '\b((?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82})\b'
  - id: svd-secret-slack-token
    languages: [generic]
    severity: ERROR
    message: Slack token in source. Revoke it and issue a new one.
    metadata: {secret_kind: "Slack token", cwe: ["CWE-798"]}
    pattern-regex: '\b(xox[abposr]-[0-9A-Za-z-]{10,72})\b'
  - id: svd-secret-stripe-key
    languages: [generic]
    severity: ERROR
    message: Stripe secret key in source. Roll it in the Stripe dashboard.
    metadata: {secret_kind: "Stripe secret key", cwe: ["CWE-798"]}
    pattern-regex: '\b((?:sk|rk)_live_[0-9a-zA-Z]{24,99})\b'
  - id: svd-secret-google-api-key
    languages: [generic]
    severity: ERROR
    message: Google API key in source. Restrict or regenerate it in Google Cloud console.
    metadata: {secret_kind: "Google API key", cwe: ["CWE-798"]}
    pattern-regex: '\b(AIza[0-9A-Za-z_-]{35})\b'
  - id: svd-secret-openai-anthropic-key
    languages: [generic]
    severity: ERROR
    message: AI provider API key in source. Revoke it in the provider console and issue a new one.
    metadata: {secret_kind: "AI provider API key", cwe: ["CWE-798"]}
    pattern-regex: '\b(sk-(?:proj-|ant-)?[A-Za-z0-9_-]{32,})\b'
  - id: svd-secret-hardcoded-password
    languages: [generic]
    severity: WARNING
    message: Hard-coded password or token assignment. Load it from the environment or a secret manager.
    metadata: {secret_kind: "Hard-coded credential", cwe: ["CWE-259"]}
    pattern-regex: '(?i)\b\w*(?:password|passwd|pwd|secret|api_?key|auth_?token|access_?token)\w*\s*[:=]\s*[''"]([^''"\s]{8,})[''"]'
