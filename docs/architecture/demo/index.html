<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Vibe Delivery — ArchFlow Demo</title>

    <!-- Self-contained viewer: no build step, no internet connection required.
     React/ReactDOM/Babel are vendored locally in ./vendor (see skill setup
     step — download once with curl if this folder doesn't exist yet). The
     component below is transpiled in the browser. -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/babel.min.js"></script>

    <style>
      html,
      body {
        margin: 0;
      }
      /* Flex-centering must live on body ONLY. If html is also display:flex,
         body becomes a shrink-to-fit flex item and #root's width:100% resolves
         against that collapsed width — the demo renders at content width
         instead of filling max-width:1500px. */
      body {
        padding: 24px;
        min-height: 100vh;
        background: #05070c;
        display: flex;
        justify-content: center;
        transition: background 0.25s;
      }
      /* The demo defaults to light, so the page around it follows suit —
         otherwise a light card sits in a near-black frame. Toggled from the
         theme state; the TSX twin deliberately leaves its host page alone. */
      body.light-page {
        background: #eef1f6;
      }
      #root {
        width: 100%;
        max-width: 1500px;
      }

      /* ===== ArchFlow engine styles — identical to DemoFlow.template.css ===== */
      .archflow-container {
        --bg: #080b11;
        --panel: #0f131c;
        --panel-glass: rgba(15, 19, 28, 0.85);
        --ink: #f3f4f6;
        --muted: #9ca3af;
        --line: #1e293b;
        --line-active: #3b82f6;
        --accent: #6366f1;
        --grid: #131924;
        --node-fill: #0f131c;
        --node-stroke: #2e3b52;
        --edge-stroke: #1e293b;
        --bubble-bg: #f3f4f6;
        --bubble-border: #cbd5e1;
        --bubble-text: #1f2937;
        --bubble-who-color: #4b5563;
        --button-bg: #151c2c;
        --button-border: #2e3b52;
        --button-hover-bg: #1f293d;
        --button-hover-border: #3b4e6f;
        --scrollbar-thumb: #1e293b;
        --header-gradient: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
        --done-fill: #121e1a;
        --done-stroke: rgba(34, 197, 94, 0.4);
        --shadow: rgba(0, 0, 0, 0.5);
        --accent-glow: rgba(99, 102, 241, 0.06);
        --node-active-stroke: #5a6578;
        --external-stroke: #6b7280;
        --external-fill: #11151f;

        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Plus Jakarta Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--line);
        box-shadow: 0 4px 20px var(--shadow);
      }

      .archflow-container.light {
        --bg: #f4f4f8;
        --panel: #ffffff;
        --panel-glass: rgba(255, 255, 255, 0.85);
        --ink: #1f2433;
        --muted: #6b7280;
        --line: #cbd5e1;
        --line-active: #2563eb;
        --accent: #4f46e5;
        --grid: #dfe2ea;
        --node-fill: #ffffff;
        --node-stroke: #cbd5e1;
        --edge-stroke: #cbd5e1;
        --bubble-bg: #f3f4f6;
        --bubble-border: #cbd5e1;
        --button-bg: #ffffff;
        --button-border: #cbd5e1;
        --button-hover-bg: #f3f4f6;
        --button-hover-border: #94a3b8;
        --scrollbar-thumb: #cbd5e1;
        --header-gradient: linear-gradient(135deg, #1f2433 0%, #4b5563 100%);
        --done-fill: #e8f5e9;
        --done-stroke: rgba(34, 197, 94, 0.6);
        --shadow: rgba(0, 0, 0, 0.1);
        --accent-glow: rgba(99, 102, 241, 0.04);
        --node-active-stroke: #a5b4fc;
        --external-stroke: #94a3b8;
        --external-fill: #eef0f4;
      }

      .archflow-container * {
        box-sizing: border-box;
      }

      .archflow-container header {
        padding: 20px 24px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        transition:
          background 0.3s,
          border-color 0.3s;
      }

      .archflow-container header h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.015em;
        background: var(--header-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .archflow-container header p {
        margin: 5px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      .archflow-container .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 24px;
        background: var(--panel-glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 5;
      }

      .archflow-container button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--button-border);
        background: var(--button-bg);
        color: var(--ink);
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
      }

      .archflow-container button:hover {
        background: var(--button-hover-bg);
        border-color: var(--button-hover-border);
        transform: translateY(-1px);
      }
      .archflow-container button:active {
        transform: translateY(1px);
      }

      .archflow-container button.primary {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        border-color: #6366f1;
        color: #fff;
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
      }
      .archflow-container button.primary:hover {
        background: linear-gradient(135deg, #4f46e5, #4338ca);
        box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
      }
      .archflow-container button:disabled {
        opacity: 0.35;
        cursor: default;
        transform: none !important;
        box-shadow: none !important;
      }

      .archflow-container .toolbar .spacer {
        flex: 1;
      }

      .archflow-container .speed {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      .archflow-container .speed-btn {
        padding: 2px 8px;
        font-size: 13px;
        font-weight: 700;
        min-width: 24px;
        height: 24px;
        line-height: 1;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .archflow-container #speedVal {
        font-family: "JetBrains Mono", monospace;
        min-width: 38px;
        text-align: center;
        font-weight: 600;
        display: inline-block;
      }

      .archflow-container .phase-tag {
        font-size: 12px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.1);
        color: #a5b4fc;
        border: 1px solid rgba(99, 102, 241, 0.25);
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .archflow-container.light .phase-tag {
        color: #4f46e5;
        background: rgba(79, 70, 229, 0.08);
        border: 1px solid rgba(79, 70, 229, 0.2);
      }
      .archflow-container .phase-tag::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 6px #4ade80;
        animation: statusPulse 1.8s infinite;
      }

      @keyframes statusPulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      .archflow-container .wrap {
        display: flex;
        gap: 0;
        align-items: stretch;
        min-height: 0;
      }

      .archflow-container .stage-area {
        flex: 1;
        min-width: 0;
        background: radial-gradient(
          circle,
          var(--grid) 1.2px,
          transparent 1.2px
        );
        background-size: 24px 24px;
        background-color: var(--bg);
        overflow: hidden;
        position: relative;
      }

      .archflow-container svg.stage {
        display: block;
        width: 100%;
        height: auto;
        /* Rubber-band selection drags across node labels — never let that turn
           into a text selection. */
        user-select: none;
        -webkit-user-select: none;
      }

      .archflow-container .side {
        width: 380px;
        flex: none;
        border-left: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
      }
      .archflow-container .side h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--line);
      }

      .archflow-container .log {
        padding: 12px 18px 20px;
        overflow-y: auto;
        max-height: 65vh;
      }
      .archflow-container .log::-webkit-scrollbar {
        width: 6px;
      }
      .archflow-container .log::-webkit-scrollbar-track {
        background: transparent;
      }
      .archflow-container .log::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 999px;
      }
      .archflow-container .log::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      .archflow-container .log-item {
        display: flex;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: 8px;
        border: 1px solid transparent;
        opacity: 0;
        transform: translateY(6px);
        animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes pop {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .archflow-container .log-item.cur {
        background: rgba(99, 102, 241, 0.04);
        border-color: rgba(99, 102, 241, 0.12);
      }

      .archflow-container .log-num {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        font-family: "JetBrains Mono", monospace;
        color: #fff;
        background: var(--accent);
      }
      .archflow-container .log-item.data .log-num {
        background: #0ea5a4;
      }
      .archflow-container .log-item.work .log-num {
        background: #f59e0b;
      }

      .archflow-container .log-body {
        color: var(--ink);
        transition: color 0.3s;
      }
      .archflow-container .log-route {
        display: block;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        color: var(--muted);
        margin-bottom: 2px;
        font-weight: 600;
        transition: color 0.3s;
      }

      .archflow-container .edge {
        fill: none;
        stroke: var(--edge-stroke);
        stroke-width: 2.2;
        transition:
          stroke 0.25s,
          stroke-width 0.25s;
      }
      .archflow-container .edge.dashed {
        stroke-dasharray: 6 5;
      }
      .archflow-container .edge.active {
        stroke: var(--line-active);
        stroke-width: 3.5;
        filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.5));
        transition:
          stroke 0.25s,
          filter 0.25s;
      }
      .archflow-container .edge.active.call {
        stroke: #6366f1;
        filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.5));
      }
      .archflow-container.light .edge.active.call {
        stroke: #4f46e5;
        filter: drop-shadow(0 0 5px rgba(79, 70, 229, 0.4));
      }
      .archflow-container .edge.active.data {
        stroke: #0ea5a4;
        filter: drop-shadow(0 0 5px rgba(14, 165, 164, 0.5));
      }
      .archflow-container .edge.active.flow {
        stroke-dasharray: 8 6;
        animation: dash 0.5s linear infinite;
      }
      .archflow-container .edge.active.flow.flow-reverse {
        animation: dash-reverse 0.5s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -28;
        }
      }
      @keyframes dash-reverse {
        to {
          stroke-dashoffset: 28;
        }
      }

      .archflow-container .arrow {
        fill: #475569;
        transition: fill 0.25s;
      }
      .archflow-container.light .arrow {
        fill: #94a3b8;
      }
      .archflow-container .arrow.blink {
        animation: arrowBlink 0.8s ease-in-out;
      }
      @keyframes arrowBlink {
        0%,
        100% {
          fill: #475569;
          filter: none;
        }
        20%,
        60% {
          fill: var(--line-active);
          filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.95));
        }
        40%,
        80% {
          fill: #93c5fd;
        }
      }

      .archflow-container .node {
        cursor: grab;
        touch-action: none;
        transform: translate(var(--drag-x, 0px), var(--drag-y, 0px));
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .archflow-container .node:hover {
        transform: translate(var(--drag-x, 0px), var(--drag-y, 0px)) scale(1.02)
          translateY(-2px);
      }
      .archflow-container .node.dragging,
      .archflow-container .node.dragging:hover {
        cursor: grabbing;
        transition: none;
        transform: translate(var(--drag-x, 0px), var(--drag-y, 0px));
      }
      /* Multi-select: shift-click, rubber-band, or ⬚ Select all. Dragging any
         member moves the whole selection, so the diagram can be shifted around
         the stage in one piece. */
      .archflow-container .node.selected .node-card {
        stroke: var(--accent);
        stroke-width: 2.2;
        filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.55));
      }
      .archflow-container .marquee {
        fill: rgba(99, 102, 241, 0.12);
        stroke: var(--accent);
        stroke-width: 1.2;
        stroke-dasharray: 5 4;
        pointer-events: none;
      }
      .archflow-container .node-card {
        fill: var(--node-fill);
        stroke: var(--node-stroke);
        stroke-width: 1.5;
        transition:
          stroke 0.25s,
          fill 0.25s,
          filter 0.25s;
      }

      .archflow-container .node.external .node-card {
        fill: var(--external-fill);
        stroke: var(--external-stroke);
        stroke-dasharray: 5 4;
      }
      .archflow-container .node.active .node-card {
        stroke: var(--node-active-stroke);
        stroke-width: 1.8;
        fill: var(--node-fill);
        filter: drop-shadow(0 2px 8px var(--accent-glow));
      }
      .archflow-container .node.external.active .node-card {
        stroke: var(--line-active);
        fill: var(--external-fill);
      }
      .archflow-container .node.working .node-card {
        animation: workpulse 1.2s ease-in-out infinite;
      }
      @keyframes workpulse {
        0%,
        100% {
          filter: drop-shadow(0 0 0 rgba(245, 158, 11, 0));
          stroke: var(--node-stroke);
        }
        50% {
          filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.5));
          stroke: #f59e0b;
        }
      }
      .archflow-container .node.done .node-card {
        stroke: var(--done-stroke);
        fill: var(--done-fill);
      }

      .archflow-container .node-title {
        font-size: 13.5px;
        font-weight: 700;
        fill: var(--ink);
        transition: fill 0.3s;
      }
      .archflow-container .node-sub {
        font-size: 10px;
        fill: var(--muted);
        transition: fill 0.3s;
      }
      .archflow-container .node-icon {
        font-size: 19px;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .archflow-container .pulse {
        fill: var(--line-active);
        stroke: var(--bg);
        stroke-width: 2;
        filter: drop-shadow(0 0 6px var(--line-active));
      }
      .archflow-container .pulse.data {
        fill: #0ea5a4;
        filter: drop-shadow(0 0 6px #0ea5a4);
      }
      .archflow-container .pulse.call {
        fill: #6366f1;
        filter: drop-shadow(0 0 6px #6366f1);
      }

      .archflow-container .bubble-wrap {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }
      .archflow-container .bubble-wrap.above {
        align-items: flex-end;
      }
      .archflow-container .bubble-wrap.below {
        align-items: flex-start;
      }

      .archflow-container .bubble {
        position: relative;
        max-width: 190px;
        background: var(--bubble-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1.5px solid var(--bubble-border);
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 11.5px;
        line-height: 1.3;
        color: var(--bubble-text);
        box-shadow: 0 8px 24px var(--shadow);
        animation: bubbleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        transition:
          background 0.3s,
          border-color 0.3s,
          color 0.3s,
          box-shadow 0.3s;
      }
      @keyframes bubbleIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .archflow-container .bubble-who {
        display: block;
        font-weight: 700;
        font-size: 9px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 3px;
        color: var(--bubble-who-color);
      }
      .archflow-container .bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        border: 5px solid transparent;
      }
      .archflow-container .bubble.tail-down::after {
        top: 100%;
        border-top-color: var(--bubble-bg);
        margin-top: -1px;
        transition: border-top-color 0.3s;
      }
      .archflow-container .bubble.tail-up::after {
        bottom: 100%;
        border-bottom-color: var(--bubble-bg);
        margin-bottom: -1px;
        transition: border-bottom-color 0.3s;
      }

      .archflow-container footer {
        padding: 16px 24px 24px;
        font-size: 12.5px;
        color: var(--muted);
        background: var(--panel);
        border-top: 1px solid var(--line);
        line-height: 1.6;
      }
      .archflow-container footer b {
        color: var(--ink);
      }

      .archflow-container .legend {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .archflow-container .legend span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      .archflow-container .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 6px currentColor;
      }

      @media (max-width: 980px) {
        .archflow-container .wrap {
          flex-direction: column;
        }
        .archflow-container .side {
          width: auto;
          border-left: none;
          border-top: 1px solid var(--line);
        }
        .archflow-container .log {
          max-height: 32vh;
        }
      }

      .archflow-container .node.db-ingesting .node-card {
        stroke: #336791 !important;
        stroke-width: 2.2px !important;
        animation: dbIngestGlow 0.4s infinite alternate;
      }
      @keyframes dbIngestGlow {
        from {
          filter: drop-shadow(0 0 3px rgba(51, 103, 145, 0.4));
        }
        to {
          filter: drop-shadow(0 0 14px rgba(51, 103, 145, 0.8));
        }
      }

      .archflow-container .transfer-modal {
        font-family: "JetBrains Mono", monospace;
        background: rgba(15, 23, 42, 0.95);
        border: 1.5px solid #336791;
        border-radius: 8px;
        width: 100%;
        height: 100%;
        box-shadow: 0 10px 25px rgba(51, 103, 145, 0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: #e2e8f0;
        opacity: 0;
        transform: scale(0.9) translateY(10px);
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      .archflow-container .transfer-modal.show {
        opacity: 1;
        transform: none;
      }
      .archflow-container .transfer-header {
        background: #1e293b;
        padding: 6px 10px;
        font-size: 8.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .archflow-container .transfer-icon {
        font-size: 10px;
      }
      .archflow-container .transfer-title {
        color: #cbd5e1;
      }
      .archflow-container .transfer-pct {
        margin-left: auto;
        color: #38bdf8;
        font-weight: 800;
      }

      .archflow-container .transfer-progress-container {
        background: #0f172a;
        height: 6px;
        width: calc(100% - 20px);
        margin: 8px 10px 4px;
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid #1e293b;
      }
      .archflow-container .transfer-progress-bar {
        background: linear-gradient(90deg, #336791 0%, #38bdf8 100%);
        height: 100%;
        width: 0%;
        border-radius: 3px;
        transition: width 0.1s linear;
        box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
      }
      .archflow-container .transfer-stats {
        display: flex;
        justify-content: space-between;
        padding: 0 10px;
        font-size: 8px;
        color: #94a3b8;
      }

      .archflow-container .transfer-log {
        flex: 1;
        background: #090d16;
        margin: 6px 10px 8px;
        border-radius: 4px;
        border: 1px solid #1e293b;

            // The request dies here. The initiator is no longer carrying a
            // live flow, so every later step it would have started is
            // stranded too, and whatever this step was meant to deliver
            // never arrives.
            reached.delete(initiator);
            starved.add(s.t);
            return removed ? 'blocked' : 'unreachable';
          }
          reached.add(s.f);
          reached.add(s.t);
          starved.delete(s.t);
          return 'ok';
        });
      }

      // Cached because it is read once per log entry; invalidated on every
      // remove/restore.
      let STATUS_CACHE = null;
      function stepStatuses() {
        if (!STATUS_CACHE) STATUS_CACHE = computeStatuses();
        return STATUS_CACHE;
      }
      function invalidateStatuses() { STATUS_CACHE = null; }

      function ArchFlowDemo() {
        const [theme, setTheme] = useState('light');
        const [speed, setSpeed] = useState(0.5);
        const [isPlaying, setIsPlaying] = useState(false);
        const [phaseText, setPhaseText] = useState('Ready');
        const [isDoneDisabled, setIsDoneDisabled] = useState(false);
        // progress mirrors idxRef into React state so the scrubber / step
        // counter / button labels re-render as the run advances.
        const [progress, setProgress] = useState(-1);
        // Node inspector: id of the clicked node, or null when closed.
        const [inspected, setInspected] = useState(null);
        // Connection inspector: pairKey of the clicked link, or null.
        const [selectedLink, setSelectedLink] = useState(null);
        // Bumped on every remove/restore so the JSX (which reads
        // REMOVED_LINKS directly) re-renders and the link-visual effect runs.
        const [linkVersion, setLinkVersion] = useState(0);
        // Same trick for link labels and group boxes, which also live outside
        // React state.
        const [labelVersion, setLabelVersion] = useState(0);
        const [noteVersion, setNoteVersion] = useState(0);
        const [groupVersion, setGroupVersion] = useState(0);

        const stageRef = useRef(null);
        const logRef = useRef(null);
        const scrubTrackRef = useRef(null);

        const playingRef = useRef(false);
        const idxRef = useRef(-1);
        const speedRef = useRef(0.5);
        const animRef = useRef(null);
        // True while a ⏭ Step single-step animation runs — jumpTo must not
        // fire then (DOM log-item listeners bypass the disabled-button guards).
        const ffRef = useRef(false);
        // Node cards have been dragged since the last save (enables 💾 Save
        // layout); flips to a "Saved" confirmation for a moment after saving.
        const [layoutDirty, setLayoutDirty] = useState(false);
        const [layoutSaved, setLayoutSaved] = useState(false);

        const [isFullscreen, setIsFullscreen] = useState(false);
        const containerRef = useRef(null);

        const toggleFullscreen = () => {
          if (!containerRef.current) return;
          if (!document.fullscreenElement) {
            containerRef.current.requestFullscreen().then(() => setIsFullscreen(true)).catch((err) => console.error(err));
          } else {
            document.exitFullscreen();
            setIsFullscreen(false);
          }
        };

        useEffect(() => {
          const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
          document.addEventListener('fullscreenchange', handleFullscreenChange);
          return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
        }, []);

        useEffect(() => {
          document.body.classList.toggle('light-page', theme === 'light');
        }, [theme]);

        useEffect(() => {
          Object.keys(nodeElsRef.current).forEach((id) =>
            nodeElsRef.current[id].classList.toggle('inspected', id === inspected)
          );
        }, [inspected]);

        // ⌘/Ctrl+A selects every node, Esc drops the selection. The page is
        // just this demo, so hijacking select-all is safe — except inside a
        // real text field, where the browser's own meaning must win.
        useEffect(() => {
          const onKey = (e) => {
            const t = e.target;
            if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a') {

            }
          };
          document.addEventListener('keydown', onKey);
          return () => document.removeEventListener('keydown', onKey);
        }, []);

        // One repaint path for every grouping change (create, rename, ungroup).
        useEffect(() => {
          if (renderGroupsRef.current) renderGroupsRef.current();
        }, [groupVersion]);

        // noteVersion exists so the inspector re-renders with the new text;
        // the note itself is redrawn by the editor that changed it.
        useEffect(() => {
          if (noteVersion && renderNoteRef.current && inspected) renderNoteRef.current(inspected);
        }, [noteVersion]);

        const edgesRef = useRef({});
        const nodeElsRef = useRef({});
        const pulseRef = useRef(null);
        const allArrowsRef = useRef([]);
        const bubbleLayerRef = useRef(null);
        const bubbleElsRef = useRef([]);
        const dbParticlesGroupRef = useRef(null);
        const pgConsoleFORef = useRef(null);
        // Handles into the imperative stage, so the inspector (React) can
        // retitle a link and the link-visual effect can redraw one.
        const renderLabelRef = useRef(null);
        const openLabelEditorRef = useRef(null);
        const renderNoteRef = useRef(null);
        const openNoteEditorRef = useRef(null);
        const renderGroupsRef = useRef(null);
        const openGroupEditorRef = useRef(null);

        // Multi-select. The ids live in a ref (the drag handlers, built once,

        // state, purely so the toolbar button can re-label itself.
        const selectionRef = useRef(new Set());
        const [selCount, setSelCount] = useState(0);
        // Single place that turns the ref into what you see, so selection can
        // never drift from the highlighted cards.
        const paintSelection = () => {
          const sel = selectionRef.current;
          Object.keys(nodeElsRef.current).forEach((id) =>
            nodeElsRef.current[id].classList.toggle('selected', sel.has(id))

        };
        const setSelection = (ids) => {
          selectionRef.current = new Set(ids);
